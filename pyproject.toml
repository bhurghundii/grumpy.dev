[project]
name = "grumpy"
version = "0.1.0"
description = "grumpy — a merge gate that checks the developer understands the change"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    # Phase 1 §7's own convention: any code path that calls a model or an
    # external HTTP service must be async httpx, never a sync SDK client.
    # First actually used by app/grading.py's RealGrader (phase 4); already
    # a dev dependency since phase 2 for fastapi.testclient.TestClient.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
package = false
