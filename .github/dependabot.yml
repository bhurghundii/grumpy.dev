version: 2
updates:
  # GitHub Actions used in .github/workflows/ (actions/checkout,
  # actions/github-script).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The python:*-slim base image pinned in Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # pyproject.toml / uv.lock. The uv ecosystem updates both together; the pip
  # ecosystem bumped pyproject.toml without refreshing uv.lock, which broke
  # CI's lockfile check.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
