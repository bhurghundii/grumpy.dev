name: grumpy

# Merge gate: asks whoever opened/updated the PR a question about their own
# diff. See README for the phase breakdown; this workflow is the "Action"
# side of the Action-facing API (POST /sessions).
#
# The gate is not this job. It's the `grumpy/verdict` commit status, which
# the grumpy server posts on the PR's head commit — pending as soon as the
# session exists, success or failure the moment the answer is graded (needs
# GITHUB_STATUS_TOKEN on the server; see INTEGRATION.md). Make that the
# required check. This job only opens the session, links it on the PR and
# confirms the status landed, so it finishes in seconds and goes red only
# when something is actually broken.
#
# It used to wait for the answer here instead: poll GET /verdict for ten
# minutes, then fail on whatever it last saw. Authors rarely answer inside
# ten minutes — and couldn't have here, since the link was only commented
# after the polling loop finished — so the check was red on nearly every
# PR, and held a runner for ten minutes getting there.
#
# Runs on a GitHub-hosted runner — grumpy is hosted publicly (see the
# GRUMPY_BASE_URL secret), so any ubuntu-latest runner can reach it.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: read

jobs:
  # Not named `grumpy`, which is what the old blocking job was called: a
  # repo whose branch protection still requires that check then blocks
  # merges ("Expected — waiting for status") until it's pointed at
  # `grumpy/verdict`, rather than quietly letting PRs through ungated.
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitHub does not pass secrets to workflow runs triggered by a PR
      # from a fork, and gives those runs a read-only token. Without this
      # check the curl below sends `Authorization: Bearer ` (empty), takes
      # a 401, and fails the job — presenting "your PR is broken" to an
      # outside contributor who did nothing wrong and cannot fix it.
      #
      # Deliberately NOT solved with `pull_request_target`: that runs the
      # workflow with secrets against the *base* repo while checking out
      # untrusted head code, a well-known privilege-escalation footgun. A
      # maintainer who wants fork PRs gated should run the gate after
      # merging to a trusted branch. A skipped fork PR never gets a
      # `grumpy/verdict` status, so if that's a required check, merging one
      # takes a maintainer bypassing the requirement.
      - name: Check grumpy is configured for this run
        id: config
        env:
          GRUMPY_BASE_URL: ${{ secrets.GRUMPY_BASE_URL }}
          GRUMPY_TOKEN: ${{ secrets.GRUMPY_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          if [ -n "$GRUMPY_BASE_URL" ] && [ -n "$GRUMPY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          if [ "$IS_FORK" = "true" ]; then
            reason="this PR is from a fork, and GitHub does not share repository secrets with fork PR runs"
          else
            reason="the GRUMPY_BASE_URL and/or GRUMPY_TOKEN repository secrets are not set"
          fi

          echo "::notice title=grumpy skipped::Not run because $reason."
          {
            echo "### grumpy: SKIPPED"
            echo
            echo "Not run because $reason."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ask grumpy
        id: grumpy
        if: steps.config.outputs.configured == 'true'
        env:
          GRUMPY_BASE_URL: ${{ secrets.GRUMPY_BASE_URL }}
          GRUMPY_TOKEN: ${{ secrets.GRUMPY_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Three dots, not two. `git diff A B` is a straight tree-to-tree
          # comparison, and github.event.pull_request.base.sha is the tip
          # of the base branch at event time, NOT the merge base. So once
          # anything lands on the base branch after this PR was opened, a
          # two-dot diff also contains the *reverse* of those commits —
          # code the PR author never touched, presented to them as their
          # own change and to the grader as a claim about this diff.
          # `A...B` diffs from the merge base, which is what "the whole PR
          # against its base" actually means.
          git diff "$BASE_SHA...$HEAD_SHA" > /tmp/grumpy.diff

          # Called on every run, not only when no session exists yet. It's
          # idempotent — a re-run gets the existing session back with a 200
          # instead of a 201 — and it's also what makes the server re-post
          # `grumpy/verdict`, so re-running this job is the fix if a status
          # post to GitHub ever failed.
          code=$(jq -n \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --rawfile diff /tmp/grumpy.diff \
            '{repo: $repo, pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha, diff: $diff}' \
            | curl -sS -o /tmp/grumpy.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GRUMPY_TOKEN" \
                -H "Content-Type: application/json" \
                --data @- \
                "$GRUMPY_BASE_URL/sessions")

          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error title=grumpy::POST /sessions returned HTTP $code: $(cat /tmp/grumpy.json)"
            exit 1
          fi

          # Only a newly created session gets a PR comment, so re-runs
          # don't pile up duplicate links.
          if [ "$code" = "201" ]; then
            echo "session_url=$(jq -r .session_url /tmp/grumpy.json)" >> "$GITHUB_OUTPUT"
          fi
          echo "### grumpy: $(jq -r .status /tmp/grumpy.json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment session link
        if: steps.grumpy.outputs.session_url
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "🧐 **grumpy** has a question about this change:",
                "",
                `${{ steps.grumpy.outputs.session_url }}`,
                "",
                "Once it's answered, the `grumpy/verdict` check on this PR updates by itself.",
              ].join("\n"),
            });

      # Without GITHUB_STATUS_TOKEN on the server nothing posts
      # `grumpy/verdict`, so nothing gates the merge — and this job would
      # go green having gated nothing. Fail with the fix instead. Runs
      # after the comment, so the question is still answerable meanwhile;
      # re-run this job once the server is fixed and the status catches up.
      - name: Check grumpy posted its commit status
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          state=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq '.statuses[] | select(.context == "grumpy/verdict") | .state')

          if [ -z "$state" ]; then
            echo "::error title=grumpy::No grumpy/verdict status on $HEAD_SHA. Set GITHUB_STATUS_TOKEN on the grumpy server (a token with Commit statuses: write on this repo), then re-run this job. The server logs say why if it is set."
            exit 1
          fi
          echo "grumpy/verdict is $state."
